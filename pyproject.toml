[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biosyn-agent"
version = "0.2.0"
description = "Biological design with Biomni, MCP tools and computational feedback"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "biomni==0.0.8", "mcp==1.30.0", "pydantic>=2.11,<3", "anyio>=4.9,<5",
  "httpx>=0.27,<1", "PyYAML>=6,<7", "jsonschema>=4.23,<5", "python-dotenv>=1,<2",
  "langchain>=0.3,<1", "langchain-openai>=0.3,<1", "langgraph>=0.6,<1",
  "langchain-community>=0.3,<0.4", "langchain-experimental>=0.3,<0.4",
  "numpy>=1.26,<3", "scipy>=1.12,<2", "beautifulsoup4>=4,<5",
  "pandas>=2,<3", "requests>=2,<3", "tqdm>=4,<5", "biopython>=1.83,<2", "ViennaRNA>=2.6,<3",
]

[project.urls]
Demo = "https://zhymlumine.github.io/biosyn-agent-demo/"

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9"]
protein = ["protein-design-mcp==2.4.5"]
comparison = ["sympy==1.14.0"]
benchmarks = ["sbol3==1.2.0.post0", "networkx==3.4.2", "xlrd==2.0.1"]

[project.scripts]
biosyn = "biosyn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/biomni"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
